name: CI Documentation and Code style

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false  # do not keep the token around

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run:  ./configure --dev

      - name: Check documentation and HTML for errors and dead links
        run: make docs-check

      - name: Check documentation for style errors
        run: make doc8

      - name: Check for Code style errors
        run: make check
